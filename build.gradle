plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

// Enable resource filtering for property interpolation
processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	filesMatching('**/*.properties') {
		filter {
			it.replace('@project.version@', project.version.toString())
		}
	}
}

repositories {
	mavenCentral()
}

// Set project version for /management/info endpoint
ext {
    set('springBootVersion', '4.1.1')
}

// Pass version to Spring Boot
bootJar {
    archiveVersion = version
}
jar {
    archiveVersion = version
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.telegram:telegrambots:6.9.7.1'
	implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
