spring.application.name=bank-start

# Main datasource (bankdb - transaction data)
spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA main datasource
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Secondary datasource for dynamic rules (rulesdb)
spring.rules.datasource.url=jdbc:h2:mem:rulesdb
spring.rules.datasource.driver-class-name=org.h2.Driver
spring.rules.datasource.username=sa
spring.rules.datasource.password=
spring.rules.jpa.hibernate.ddl-auto=update
spring.rules.jpa.open-in-view=false
spring.rules.jpa.properties.hibernate.default_schema=PUBLIC

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
